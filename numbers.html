<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div>
        <p>
            number operations
        </p>
    </div>
    <script>
        // exponential
        let y=5
        let x=6

        let w=y**x
        console.log(w)

        // increment & decrement
        let number=200
        number++
        number++
        number++
        number--
        
        console.log(number)
        console.log(number)
        console.log(number)
        console.log(number)

        let a=4
        let b="5"
        let c=a+b
        console.log(c)

        let d=6
        let e="2"
        let f=d/e
        console.log(f)

        let value=5
        let new_value=String(value)
        console.log(typeof(new_value))

        let num="576"
        let num1=Number(num)
        let num3=parseInt(num)

        console.log(num1)
        console.log(num3)




    </script>
</body>
</html>
